[pytest]
# 只收集当前项目的测试：vendor/ 下是参考项目（text-to-sql-agent-system），
# 它自带的 tests/ 会在裸跑 `pytest` 时被一并收集并产生约 50 个 ImportError，
# 这不是当前项目的失败。显式限定 testpaths 后，`pytest -q` 与 `pytest tests -q` 等价。
testpaths = tests
norecursedirs = vendor .git .venv venv node_modules frontend dist build .pytest_cache __pycache__ data
python_files = test_*.py
python_classes = Test*
python_functions = test_*
